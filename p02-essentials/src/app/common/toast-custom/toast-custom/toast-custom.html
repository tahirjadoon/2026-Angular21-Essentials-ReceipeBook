@let list = toastMessageService.toastmessages();

<div class="toast-container">
  @for (toast of list; track toast.id; let i = $index) {
    <div class="toastmessage enter"
         [class]="toast.type"
         [style.bottom.px]="(list.length - 1 - i) * 70">
      <span class="icon"></span>
      <span class="text">{{ toast.text }}</span>
      <div class="progress-bar"></div>
    </div>
  }
</div>
