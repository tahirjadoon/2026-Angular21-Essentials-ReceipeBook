@if (busy.isBusy()) {
  <div class="busy-root" aria-busy="true">
    <div class="busy-scrim"></div>
    <div class="busy-bar-track">
      <div class="busy-bar-shimmer"></div>
    </div>
    <div class="busy-center">
      <div class="busy-loading-wrapper">
        <div class="spinner"></div>
        <p class="busy-label">Working…</p>
      </div>
    </div>
  </div>
}
