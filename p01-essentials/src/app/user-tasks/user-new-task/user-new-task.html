<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
  <h2>Add Task</h2>
  <form #form="ngForm" (ngSubmit)="onCreateTask(form)" novalidate>
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" #titleCtrl="ngModel" required [(ngModel)]="task.title" />
      @if (titleCtrl.invalid && titleCtrl.touched) {
        <small class="error">Title is required.</small>
      }
    </p>

    <p>
      <label for="summary">Summary</label>
      <textarea id="summary" rows="5" name="summary" #summaryCtrl="ngModel" required [(ngModel)]="task.summary"></textarea>
      @if (summaryCtrl.invalid && summaryCtrl.touched) {
        <small class="error">Summary is required.</small>
      }
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <input type="date" id="due-date" name="duedate" #duedateCtrl="ngModel" required [(ngModel)]="task.dueDate" (change)="task.dueDate = $event.target.value" />
      @if (duedateCtrl.invalid && duedateCtrl.touched) {
        <small class="error">Due date is required.</small>
      }
    </p>

    <p class="actions">
      <button type="button" (click)="onCancel()">Cancel</button>
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
