@if(hasTasks() && tasksCountMoreThanOne()){
<p>
  <a routerLink="./" [queryParams]="{order: sort()}">Sort {{ order() === 'asc' ? 'Descending' : 'Asending' }} </a>
</p>
}
<ul>
  @for (task of userTasks(); track task.id) {
    <li>
      <app-task [task]="task" [userId]="userId()" [userName]="userName()" />
    </li>
  } @empty {
    <p>There are no tasks yet. Start adding some!</p>
  }
</ul>
