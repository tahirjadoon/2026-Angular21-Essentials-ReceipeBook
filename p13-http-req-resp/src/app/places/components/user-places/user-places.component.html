<app-places-container title="Your Favorite Places">
   @if(error()){
    <p class="error-text">{{ error() }}</p>
  }

  @if (hasPlaces()) {
    <app-places [places]="places()!" tooltipText="Click to remove from favorite places" (selectPlace)="onRemovePlease($event)" />
  } @else {
    <p class="fallback-text">Unfortunately, no places could be found.</p>
  }
</app-places-container>
